name: CI — Holo-FFI (v11 CAS Loader & Hardlink Projector)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Holo-FFI unit tests
        run: node --test holo-ffi.test.mts
